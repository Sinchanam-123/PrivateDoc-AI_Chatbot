# Private Document AI - settings
# Change a value, save, and restart the app. Lines starting with # are comments.
# If a value is missing or invalid, a safe default is used.

[models]
llm = llama3.2:3b            # switch to llama3.2:1b if the laptop feels slow
embedding = nomic-embed-text

[chunking]
chunk_size = 800             # characters per chunk
chunk_overlap = 100          # characters shared between neighbouring chunks
section_chars = 3000         # size of a "section" for DOCX and TXT files

[retrieval]
candidates = 8               # chunks fetched from the index
top_k = 5                    # chunks given to the model after re-ranking
max_distance = 0.55          # lower = stricter (cosine distance)
strong_distance = 0.40       # closer than this is accepted without a keyword match
distance_margin = 0.12       # drop chunks this much weaker than the best one
keyword_weight = 0.3         # how much keyword overlap adds to the ranking
hybrid_search = true         # also search by exact words (BM25) and merge with the meaning-based search
lexical_candidates = 5       # extra chunks the word search may add

[generation]
context_tokens = 3072        # model context window
max_answer_tokens = 450      # longest answer
temperature = 0              # 0 = consistent answers
keep_alive = 15m             # how long the model stays in memory when idle

[logging]
enabled = true               # write retrieval scores to logs/queries.jsonl
log_questions = true         # include the question text in the log

[safety]
sanitize_passages = true          # remove instruction-like sentences ("ignore your rules...") from retrieved text
block_override_requests = true    # refuse questions that try to override the rules or ask for the system prompt
